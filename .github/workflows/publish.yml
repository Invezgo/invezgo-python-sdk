# Publishes to PyPI via Trusted Publishing (OIDC, no API token).
# Runs on a pushed tag vX.Y.Z, or manually from the Actions tab.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install -e .
          python -m unittest
      - name: Tag must match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import re;print(re.search(r'\"(.+)\"', open('invezgo/_version.py').read()).group(1))")
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "tag ${GITHUB_REF_NAME} != v${v}"; exit 1; }
      - name: Build
        run: |
          python -m pip install -U build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

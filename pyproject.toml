[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invezgo-sdk"
version = "3.0.0"
description = "Official Python SDK for the Invezgo API - Indonesia stock market data (fully typed, cached, multi API key)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Invezgo", email = "admin@invezgo.com"}]
keywords = ["invezgo", "indonesia", "stock", "saham", "idx", "bei", "market", "api", "sdk", "investment", "trading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
    "typing-extensions>=4.7.0",
]

[project.urls]
Homepage = "https://invezgo.com"
Documentation = "https://api.invezgo.com/documentation"
Repository = "https://github.com/invezgo/invezgo-sdk-python"
"Bug Reports" = "https://github.com/invezgo/invezgo-sdk-python/issues"
Changelog = "https://github.com/invezgo/invezgo-sdk-python/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["invezgo"]

[tool.setuptools.package-data]
invezgo = ["py.typed"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
